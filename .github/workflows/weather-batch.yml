name: keirin-weather-batch

on:
  schedule:
    - cron: '0 19 * * *'  # JST 04:00
  workflow_dispatch:
    inputs:
      diagnose_date:
        description: '診断対象日 YYYYMMDD（空なら通常バッチ実行）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: diagnose
        if: ${{ github.event.inputs.diagnose_date != '' }}
        run: node weather/diagnose.js ${{ github.event.inputs.diagnose_date }}
      - name: batch
        if: ${{ github.event.inputs.diagnose_date == '' }}
        run: bash weather/batch_runner.sh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
